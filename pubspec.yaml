name: copra_watch
description: "An IoT-Based Solar-Powered Mobile Copra Drying Monitoring System with Machine Learning and Data Analytics for Quality Assessment"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.0.0

  # UI & Fonts
  google_fonts: ^6.1.0
  material_design_icons_flutter: ^7.0.7296

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  connectivity_plus: ^6.0.0
  permission_handler: 13.0.0
  shared_preferences: ^2.2.3

  # Database
  sqflite: ^2.3.2
  path: ^1.8.3

  # HTTP Client
  http: ^1.5.0

  # Image handling
  image_picker: ^1.1.2
  image: ^4.1.7

  # Machine Learning / TensorFlow Lite
  tflite_flutter: ^0.12.0

  # API Integration
  dio: ^5.3.0

  # PDF Generation
  pdf: ^3.10.7
  path_provider: ^2.1.1

  # File handling
  file_picker: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.3.13

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/
    - assets/ml/

  # Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300